          <div class="test__panel" data-panel="read" hidden>
            <p class="test__step" data-i18n="test.step1"></p>

            <p class="note" data-i18n="test.honest"></p>
            <button type="button" class="btn btn--ghost" data-act="again" data-i18n="test.again"></button>
          </div>
        </div>

            <div class="field">
              <label for="calc-normal"><span data-i18n="calc.normalLabel"></span> · <b data-calc="normal"></b> <small>WPM</small> <em class="tag" data-calc="normalTag"></em></label>

            <div class="field">
              <label for="calc-orp"><span data-i18n="calc.orpigoLabel"></span> · <b data-calc="orp"></b> <small>WPM</small></label>
