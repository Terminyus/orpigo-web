<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orpigo — Daha hızlı oku. Daha çok hatırla.</title>
  <meta name="description" content="Orpigo, PDF'lerini kelime kelime, gözünün odak noktasında gösteren RSVP + ORP hız okuma uygulaması. iOS ve Android.">
  <!-- PREVIEW: remove before going live (see README) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F8FC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F15" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('orpigo-web:v1') || '{}').theme; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">İçeriğe geç</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./" aria-label="Orpigo">
        <img src="/img/logo-64.png" width="34" height="34" alt="">
        <b>ORPIGO</b>
      </a>
      <nav class="nav" aria-label="Ana menü">
        <a href="#how" data-i18n="nav.how">Nasıl çalışır</a>
        <a href="#test" data-i18n="nav.test">Hızını ölç</a>
        <a href="#tour" data-i18n="nav.tour">Uygulama</a>
        <a href="#faq" data-i18n="nav.faq">SSS</a>
        <a href="blog/" data-i18n="nav.blog">Blog</a>
      </nav>
      <div class="tools">
        <div class="seg" role="group" data-i18n-attr="aria-label:nav.lang">
          <button type="button" data-lang="tr" aria-pressed="false">TR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" data-theme-toggle data-i18n-attr="aria-label:nav.theme">
          <svg class="theme-ico-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="theme-ico-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn btn--primary header-cta" href="#download" data-i18n="nav.download">İndir</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="wrap">
        <div class="hero__main">
          <span class="eyebrow" data-i18n="hero.eyebrow">RSVP + ORP hız okuma</span>
          <div class="hero__reader">
            <i class="hero__axis" aria-hidden="true"></i>
            <div class="reader--bare" id="hero-reader"></div>
          </div>
          <p class="hero__hint" data-i18n="hero.hint">Okuyucuya dokun veya Boşluk tuşuna bas.</p>
          <div class="hero__copy" id="download">
            <h1 id="hero-title" data-i18n-html="hero.title">Daha hızlı oku.<br><em>Daha çok hatırla.</em></h1>
            <p class="hero__lead" data-i18n="hero.lead"></p>
            <div class="store">
              <a href="https://apps.apple.com/app/id6764333807" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 7v7m-3-3 3 3 3-3M10 18h4"/></svg>
                <span><small data-i18n="store.appstore_small">İndir</small><strong data-i18n="store.appstore">App Store</strong></span>
              </a>
              <a href="https://play.google.com/store/apps/details?id=com.candemsoft.orpigo" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 7v7m-3-3 3 3 3-3M10 18h4"/></svg>
                <span><small data-i18n="store.play_small">Edin</small><strong data-i18n="store.play">Google Play</strong></span>
              </a>
            </div>
          </div>
        </div>
        <div class="hero__phone">
          <div class="phone">
            <div class="phone__screen">
              <picture class="only-light">
                <source srcset="/img/android-reader_light.avif" type="image/avif">
                <img src="/img/android-reader_light.webp" width="440" height="871" fetchpriority="high" data-i18n-attr="alt:hero.phoneAlt" alt="">
              </picture>
              <picture class="only-dark">
                <source srcset="/img/android-reader_dark.avif" type="image/avif">
                <img src="/img/android-reader_dark.webp" width="440" height="871" loading="lazy" data-i18n-attr="alt:hero.phoneAlt" alt="">
              </picture>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>
        <a class="brand" href="./"><img src="/img/logo-64.png" width="34" height="34" alt=""><b>ORPIGO</b></a>
        <small data-i18n="footer.tagline"></small>
      </div>
      <nav aria-label="Footer">
        <a href="blog/" data-i18n="footer.blog">Blog</a>
        <a href="privacy/" data-i18n="footer.privacy">Gizlilik Politikası</a>
        <a href="terms/" data-i18n="footer.terms">Kullanım Koşulları</a>
        <a href="support/" data-i18n="footer.support">Destek</a>
        <a href="delete-account/" data-i18n="footer.delete">Hesap Silme</a>
      </nav>
      <div>
        <small data-i18n="footer.rights"></small>
        <small data-i18n="footer.preview"></small>
      </div>
    </div>
  </footer>
</body>
</html>
