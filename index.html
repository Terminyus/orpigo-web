<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orpigo — Daha hızlı oku. Daha çok hatırla.</title>
  <meta name="description" content="Orpigo, PDF'lerini kelime kelime, gözünün odak noktasında gösteren RSVP + ORP hız okuma uygulaması. iOS ve Android.">
  <!-- PREVIEW: remove before going live (see README) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('orpigo-web:v1') || '{}').theme; } catch (e) {}
      if (t !== 'dark') t = 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add('js');
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">İçeriğe geç</a>

<!--@header-->

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="wrap">
        <div class="hero__main">
          <span class="eyebrow" data-i18n="hero.eyebrow">RSVP + ORP hız okuma</span>
          <div class="hero__reader">
            <i class="hero__axis" aria-hidden="true"></i>
            <div class="reader--bare" id="hero-reader"></div>
          </div>
          <p class="hero__hint" data-i18n="hero.hint">Okuyucuya dokun veya Boşluk tuşuna bas.</p>
          <div class="hero__copy" id="download">
            <h1 id="hero-title" data-i18n-html="hero.title">Daha hızlı oku.<br><em>Daha çok hatırla.</em></h1>
            <p class="hero__lead" data-i18n="hero.lead"></p>
<!--@store-->
          </div>
        </div>
        <div class="hero__phone">
          <div class="phone">
            <div class="phone__screen">
              <picture class="only-light">
                <source srcset="/img/android-reader_light.avif" type="image/avif">
                <img src="/img/android-reader_light.webp" width="440" height="871" fetchpriority="high" data-i18n-attr="alt:hero.phoneAlt" alt="">
              </picture>
              <picture class="only-dark">
                <source srcset="/img/android-reader_dark.avif" type="image/avif">
                <img src="/img/android-reader_dark.webp" width="440" height="871" data-i18n-attr="alt:hero.phoneAlt" alt="">
              </picture>
            </div>
          </div>
        </div>
      </div>
    </section>
<!--@sections-->
  </main>

<!--@footer-->
</body>
</html>
