<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orpigo — Daha hızlı oku. Daha çok hatırla.</title>
  <meta name="description" content="Orpigo, PDF'lerini kelime kelime, gözünün odak noktasında gösteren RSVP + ORP hız okuma uygulaması. iOS ve Android.">
  <!-- PREVIEW: remove before going live (see README) -->
  <meta name="robots" content="noindex, nofollow">
<!--@head-->
  <link rel="canonical" href="https://orpigo.com/">
  <link rel="alternate" hreflang="tr" href="https://orpigo.com/">
  <link rel="alternate" hreflang="en" href="https://orpigo.com/?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://orpigo.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Orpigo">
  <meta property="og:url" content="https://orpigo.com/">
  <meta property="og:title" content="Orpigo — Daha hızlı oku. Daha çok hatırla.">
  <meta property="og:description" content="PDF'lerini kelime kelime, gözünün odak noktasında oku. RSVP + ORP hız okuma uygulaması, iOS ve Android.">
  <meta property="og:image" content="https://orpigo.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:locale:alternate" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Orpigo — Daha hızlı oku. Daha çok hatırla.">
  <meta name="twitter:description" content="PDF'lerini kelime kelime, gözünün odak noktasında oku.">
  <meta name="twitter:image" content="https://orpigo.com/og.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Orpigo",
    "description": "RSVP + ORP speed reading app. Upload a PDF and read it one word at a time at a fixed focal point.",
    "operatingSystem": "iOS, Android",
    "applicationCategory": "EducationalApplication",
    "inLanguage": ["tr", "en"],
    "url": "https://orpigo.com/",
    "image": "https://orpigo.com/og.png",
    "installUrl": ["https://apps.apple.com/app/id6764333807", "https://play.google.com/store/apps/details?id=com.candemsoft.orpigo"],
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY", "description": "Free download; optional in-app Premium subscription" },
    "publisher": { "@type": "Organization", "name": "Candemsoft", "url": "https://orpigo.com/" }
  }
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">İçeriğe geç</a>

<!--@header-->

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="wrap">
        <div class="hero__main">
          <span class="eyebrow" data-i18n="hero.eyebrow">RSVP + ORP hız okuma</span>
          <div class="hero__reader">
            <i class="hero__axis" aria-hidden="true"></i>
            <div class="reader reader--bare" id="hero-reader"></div>
          </div>
          <p class="hero__hint" data-i18n="hero.hint">Okuyucuya dokun veya Boşluk tuşuna bas.</p>
          <div class="hero__copy" id="download">
            <h1 id="hero-title" data-i18n-html="hero.title">Daha hızlı oku.<br><em>Daha çok hatırla.</em></h1>
            <p class="hero__lead" data-i18n="hero.lead"></p>
<!--@store-->
          </div>
        </div>
        <div class="hero__phone">
          <div class="phone">
            <div class="phone__screen">
              <picture class="only-light">
                <source srcset="/img/android-reader_light.avif" type="image/avif">
                <img src="/img/android-reader_light.webp" width="440" height="871" fetchpriority="high" data-i18n-attr="alt:hero.phoneAlt" alt="">
              </picture>
              <picture class="only-dark">
                <source srcset="/img/android-reader_dark.avif" type="image/avif">
                <img src="/img/android-reader_dark.webp" width="440" height="871" data-i18n-attr="alt:hero.phoneAlt" alt="">
              </picture>
            </div>
          </div>
        </div>
      </div>
    </section>
<!--@sections-->
  </main>

<!--@footer-->
</body>
</html>
